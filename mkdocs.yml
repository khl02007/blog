site_name: Kyu Hyun Lee
site_url: http://khl02007.github.io
nav:
  - About: index.md
  - Blog:
    - blog/index.md
theme: 
  name: material
  icon: 
    logo: material/brain
  palette:
    primary: grey
    accent: black
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
plugins:
  - search
  - blog
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
